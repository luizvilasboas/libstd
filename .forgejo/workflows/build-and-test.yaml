name: Build and Test
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  build-and-test:
    runs-on: codeberg-small-lazy
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt install -y clang make check valgrind clang-format
      - name: Lint
        run: make lint
      - name: Build
        run: make all
      - name: Test
        run: make test
      - name: Check leaks
        run: make leak
